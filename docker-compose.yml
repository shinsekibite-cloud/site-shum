version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    mem_limit: 384m
    memswap_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sochi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sochi_portal}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: always
    mem_limit: 96m
    memswap_limit: 128m
    command:
      [
        'redis-server',
        '--save', '',
        '--appendonly', 'no',
        '--maxmemory', '64mb',
        '--maxmemory-policy', 'allkeys-lru',
        '--requirepass', '${REDIS_PASSWORD}',
        '--bind', '0.0.0.0',
        '--protected-mode', 'yes',
      ]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Localhost only — Nginx terminates TLS on 443
      - '127.0.0.1:3000:3000'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - RESEND_FROM=${RESEND_FROM:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-resend}
      - EMAIL_SMTP_BLOCKED=${EMAIL_SMTP_BLOCKED:-1}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sochi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sochi_portal}?schema=public
      - REDIS_URL=${REDIS_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://y1.idivles.ru}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - TECH_EMAIL=${TECH_EMAIL:-}
      - TECH_BOOTSTRAP_PASSWORD=${TECH_BOOTSTRAP_PASSWORD:-}
      - TECH_PASSWORD_HASH=${TECH_PASSWORD_HASH:-}
      - MODULE_FLAGS_FORCE_ON=${MODULE_FLAGS_FORCE_ON:-}
      # NODE_EXTRA_CA_CERTS set by scripts/docker-entrypoint.sh only if PEM exists
      # Cap Node heap so the 2GB VPS keeps RAM for Postgres/OS (avoids swap freezes)
      - NODE_OPTIONS=--max-old-space-size=384
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
      - ./certs:/app/certs:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    # Hard caps — OOM in container, not host freezes / nginx 502 storms
    mem_limit: 640m
    memswap_limit: 768m
    cpus: '0.90'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 50s
