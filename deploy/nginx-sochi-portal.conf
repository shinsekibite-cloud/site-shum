# Production nginx for young.idivles.ru
# Copy to /etc/nginx/sites-available/sochi-portal and reload nginx.
# Requires http-context zones from deploy/nginx-yp-limits.conf
#   → /etc/nginx/conf.d/yp-limits.conf
server {
    server_name young.idivles.ru;

    # User uploads (covers, avatars, portfolio) — allow room before server-side WebP compression
    client_max_body_size 25m;

    # Cap concurrent connections per IP (needs yp_conn zone)
    limit_conn yp_conn 40;

    # Deny encrypted archives & secrets that used to live under uploads
    location ^~ /uploads/backups/ {
        deny all;
        return 404;
    }
    location ^~ /uploads/lea/ {
        deny all;
        return 404;
    }
    location ~* ^/uploads/\. {
        deny all;
        return 404;
    }

    # Tokenized full-site archives (NOT under app public/ — survives deploy --delete).
    # Files live at /var/backups/sochi-portal/public-dl/<token>/<name>.tgz
    location ^~ /backups/ {
        alias /var/backups/sochi-portal/public-dl/;
        access_log off;
        default_type application/gzip;
        add_header Cache-Control "private, no-store";
        add_header X-Content-Type-Options "nosniff";
        types { }
        try_files $uri =404;
    }

    # Uploaded media must be served from disk: Next.js standalone
    # does not reliably expose files created after container start.
    location /uploads/ {
        alias /opt/sochi-portal/public/uploads/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        # Prefer inline open for PDFs/images; attachment via /api/documents/.../file
        types {
            application/pdf                             pdf;
            text/plain                                  txt;
            application/msword                          doc;
            application/vnd.openxmlformats-officedocument.wordprocessingml.document docx;
            image/jpeg                                  jpg jpeg;
            image/png                                   png;
            image/webp                                  webp;
            image/gif                                   gif;
        }
        default_type application/octet-stream;
        add_header Content-Disposition "inline";
        try_files $uri =404;
    }

    # Stricter bucket for auth endpoints (login / register storms)
    location /api/auth/ {
        limit_req zone=yp_auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 25m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /api/ {
        limit_req zone=yp_api burst=80 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 25m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        limit_req zone=yp_general burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 25m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/young.idivles.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/young.idivles.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name young.idivles.ru;
    return 301 https://$host$request_uri;
}
