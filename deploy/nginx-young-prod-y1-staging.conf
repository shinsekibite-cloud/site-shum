    }

    location /uploads/ {
        # staging shares prod uploads by default (read-mostly); override if needed
        alias /opt/sochi-portal/public/uploads/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /api/auth/ {
        limit_req zone=yp_auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://yp_web_staging;
