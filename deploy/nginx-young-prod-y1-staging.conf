# Dual-host nginx after promote:
#   young.idivles.ru  → PRODUCTION  127.0.0.1:3000
#   y1.idivles.ru     → STAGING     127.0.0.1:3001
#
# Copy to /etc/nginx/sites-available/sochi-portal and reload.
# Requires deploy/nginx-yp-limits.conf → /etc/nginx/conf.d/yp-limits.conf
# TLS: /etc/letsencrypt/live/{young,y1}.idivles.ru/

upstream yp_web_prod {
    server 127.0.0.1:3000 fail_timeout=3s max_fails=1;
    keepalive 16;
}

upstream yp_web_staging {
    server 127.0.0.1:3001 fail_timeout=3s max_fails=1;
    keepalive 8;
}

# ─── PRODUCTION: young.idivles.ru ───────────────────────────────────────────
server {
    server_name young.idivles.ru;

    client_max_body_size 25m;
    limit_conn yp_conn 40;

    location ^~ /uploads/backups/ { deny all; return 404; }
    location ^~ /uploads/lea/ { deny all; return 404; }
    location ~* ^/uploads/\. { deny all; return 404; }

    location ^~ /backups/ {
        alias /var/backups/sochi-portal/public-dl/;
        access_log off;
        default_type application/gzip;
        add_header Cache-Control "private, no-store";
        add_header X-Content-Type-Options "nosniff";
        types { }
        try_files $uri =404;
    }

    location ^~ /brand/ {
        alias /opt/sochi-portal/public/brand/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
    location ^~ /icons/ {
        alias /opt/sochi-portal/public/icons/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
    location ^~ /covers/ {
        alias /opt/sochi-portal/public/covers/;
        access_log off;
        expires 14d;
        add_header Cache-Control "public, max-age=1209600";
        try_files $uri =404;
    }
    location ^~ /_next/static/ {
        proxy_pass http://yp_web_prod;
        proxy_set_header Host $host;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /uploads/ {
        alias /opt/sochi-portal/public/uploads/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        types {
            application/pdf pdf;
            text/plain txt;
            application/msword doc;
            application/vnd.openxmlformats-officedocument.wordprocessingml.document docx;
            image/jpeg jpg jpeg;
            image/png png;
            image/webp webp;
            image/gif gif;
        }
        default_type application/octet-stream;
        add_header Content-Disposition "inline";
        try_files $uri =404;
    }

    location /api/auth/ {
        limit_req zone=yp_auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://yp_web_prod;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 25m;
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /api/ {
        limit_req zone=yp_api burst=80 nodelay;
        limit_req_status 429;
        proxy_pass http://yp_web_prod;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 25m;
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        limit_req zone=yp_general burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://yp_web_prod;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 25m;
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/young.idivles.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/young.idivles.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name young.idivles.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

