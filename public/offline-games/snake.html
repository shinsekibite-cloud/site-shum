<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Змейка — офлайн</title>
  <link rel="stylesheet" href="/offline-games/games.css" />
</head>
<body>
  <header class="og-top">
    <a href="/offline-games/">← Игры</a>
    <strong>Змейка</strong>
    <span></span>
  </header>
  <main class="og-main">
    <div class="hud">
      <div>Очки <strong id="score">0</strong></div>
      <div>Рекорд <strong id="best">0</strong></div>
    </div>
    <div class="canvas-wrap"><canvas id="c" width="288" height="384"></canvas></div>
    <div class="pad">
      <span></span><button class="og-btn" id="up">↑</button><span></span>
      <button class="og-btn" id="left">←</button>
      <button class="og-btn" id="down">↓</button>
      <button class="og-btn" id="right">→</button>
    </div>
    <div class="actions">
      <button class="og-btn primary" id="start">Играть</button>
    </div>
    <p class="hint" id="hint">Свайп или кнопки</p>
  </main>
  <script src="/offline-games/scores.js"></script>
  <script>
(function () {
  var CELL = 16, COLS = 18, ROWS = 24;
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var hint = document.getElementById('hint');
  var snake, dir, nextDir, food, score, timer, running, over;

  bestEl.textContent = YPGames.getBest('snake');

  function placeFood() {
    var occupied = {};
    snake.forEach(function (p) { occupied[p.x + ',' + p.y] = 1; });
    var p;
    do {
      p = { x: (Math.random() * COLS) | 0, y: (Math.random() * ROWS) | 0 };
    } while (occupied[p.x + ',' + p.y]);
    food = p;
  }

  function draw() {
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#f43f5e';
    ctx.fillRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4);
    snake.forEach(function (p, i) {
      ctx.fillStyle = i === 0 ? '#4ade80' : '#22c55e';
      ctx.fillRect(p.x * CELL + 1, p.y * CELL + 1, CELL - 2, CELL - 2);
    });
  }

  function end() {
    over = true; running = false;
    if (timer) clearInterval(timer); timer = null;
    bestEl.textContent = YPGames.setBest('snake', score);
    YPGames.report({ game: 'snake', score: score });
    hint.textContent = 'Игра окончена · очки сохранены';
    document.getElementById('start').textContent = 'Ещё раз';
  }

  function step() {
    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) return end();
    if (snake.some(function (p) { return p.x === head.x && p.y === head.y; })) return end();
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      placeFood();
    } else snake.pop();
    draw();
  }

  function start() {
    snake = [{ x: 4, y: 12 }, { x: 3, y: 12 }, { x: 2, y: 12 }];
    dir = nextDir = { x: 1, y: 0 };
    score = 0; over = false; running = true;
    scoreEl.textContent = '0';
    hint.textContent = 'Свайп или кнопки';
    document.getElementById('start').textContent = 'Заново';
    placeFood(); draw();
    if (timer) clearInterval(timer);
    timer = setInterval(step, 140);
  }

  function setDir(nd) {
    if (nd.x === -dir.x && nd.y === -dir.y) return;
    nextDir = nd;
  }

  document.getElementById('start').onclick = start;
  document.getElementById('up').onclick = function () { setDir({ x: 0, y: -1 }); };
  document.getElementById('down').onclick = function () { setDir({ x: 0, y: 1 }); };
  document.getElementById('left').onclick = function () { setDir({ x: -1, y: 0 }); };
  document.getElementById('right').onclick = function () { setDir({ x: 1, y: 0 }); };
  window.addEventListener('keydown', function (e) {
    var map = { ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 }, ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 } };
    if (map[e.key]) { e.preventDefault(); setDir(map[e.key]); }
  }, { passive: false });

  var tx, ty;
  canvas.addEventListener('touchstart', function (e) {
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, { passive: true });
  canvas.addEventListener('touchend', function (e) {
    var t = e.changedTouches[0];
    var dx = t.clientX - tx, dy = t.clientY - ty;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 });
    else setDir(dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 });
  });

  placeFood();
  snake = [{ x: 4, y: 12 }, { x: 3, y: 12 }, { x: 2, y: 12 }];
  dir = nextDir = { x: 1, y: 0 };
  score = 0;
  draw();
})();
  </script>
</body>
</html>
