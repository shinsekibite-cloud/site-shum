<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#3b82f6" />
  <title>Офлайн — Молодёжь Сочи</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: Outfit, Inter, system-ui, sans-serif;
      background: linear-gradient(160deg, #eff6ff 0%, #f8fafc 45%, #e2e8f0 100%);
      color: #0f172a;
      text-align: center;
      box-sizing: border-box;
    }
    .card {
      width: min(100%, 420px);
      background: #fff;
      border-radius: 1rem;
      padding: 2rem 1.5rem;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      border: 1px solid rgba(15, 23, 42, 0.06);
    }
    h1 { margin: 0 0 0.75rem; font-size: 1.5rem; }
    p { margin: 0 0 1.25rem; color: #64748b; line-height: 1.5; }
    .actions { display: flex; flex-direction: column; gap: 0.55rem; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.25rem;
      border-radius: 12px;
      background: #3b82f6;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
    a.secondary {
      background: #fff;
      color: #0f172a;
      border: 1px solid rgba(15, 23, 42, 0.12);
    }
    .games {
      display: grid;
      gap: 0.45rem;
      margin-top: 0.25rem;
    }
    .games a {
      background: #0f172a;
      border-radius: 12px;
    }
    .label {
      margin: 0.5rem 0 0.35rem;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Нет сети</h1>
    <p>Проверьте подключение. Пока можно поиграть в классику — игры работают офлайн.</p>
    <div class="actions">
      <a href="/">На главную</a>
      <div class="label">Офлайн-игры</div>
      <div class="games">
        <a class="secondary" href="/offline-games/snake.html">Змейка</a>
        <a class="secondary" href="/offline-games/tetris.html">Тетрис</a>
        <a class="secondary" href="/offline-games/checkers.html">Шашки</a>
        <a class="secondary" href="/offline-games/">Все игры</a>
      </div>
    </div>
  </div>
</body>
</html>
